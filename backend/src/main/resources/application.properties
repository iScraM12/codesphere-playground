# MongoDB configuration
# In dev and test mode, Quarkus Dev Services automatically starts a MongoDB container
# when no explicit connection string is configured, so no further setup is required locally.
# For production, configure the connection string via an environment variable, e.g.:
#   QUARKUS_MONGODB_CONNECTION_STRING=mongodb://<host>:27017
%prod.quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=codesphere
